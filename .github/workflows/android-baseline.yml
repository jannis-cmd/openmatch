name: Android baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_OPENMATCH_API_URL: https://janniss-macbook-air.cheetah-vernier.ts.net
      EXPO_PUBLIC_OPENMATCH_WEB_URL: https://janniss-macbook-air.cheetah-vernier.ts.net:8443
      EAS_BUILD_GIT_COMMIT_HASH: ${{ github.sha }}
      NODE_ENV: production
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expose Android command-line tools
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Verify and build shared packages
        run: |
          pnpm --filter @openmatch/mobile release:preflight:android
          pnpm build:packages

      - name: Generate the Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Build a standalone owner-testing APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK structure and signature
        working-directory: apps/mobile/android
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          unzip -t app/build/outputs/apk/release/app-release.apk
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -F 'assets/index.android.bundle'
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload immutable APK
        uses: actions/upload-artifact@v5
        with:
          name: openmatch-android-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
