name: Publish Android owner build

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Android baseline workflow run ID
        required: true
        type: string
      artifact_name:
        description: Exact immutable workflow artifact name
        required: true
        type: string
      source_revision:
        description: Full source commit embedded in the app
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  sign-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release documentation
        uses: actions/checkout@v5

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download the verified standalone APK
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
          name: ${{ inputs.artifact_name }}
          path: incoming

      - name: Restore the stable Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.OPENMATCH_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/openmatch-upload.jks"

      - name: Align and sign build 12
        env:
          KEYSTORE_PASSWORD: ${{ secrets.OPENMATCH_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OPENMATCH_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OPENMATCH_ANDROID_KEY_PASSWORD }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$SOURCE_REVISION" | grep -Eq '^[0-9a-f]{40}$'
          test "$ARTIFACT_NAME" = "openmatch-android-$SOURCE_REVISION"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -p -f 4 incoming/app-release.apk openmatch-android-0.1.0-build-12.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/openmatch-upload.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            openmatch-android-0.1.0-build-12.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs openmatch-android-0.1.0-build-12.apk | tee signing-verification.txt
          grep -Fq 'c47346d5c2b975888c66a35f6204f918d91bb8c7729fb59f6ca6848d1a63f29d' signing-verification.txt
          unzip -t openmatch-android-0.1.0-build-12.apk
          unzip -l openmatch-android-0.1.0-build-12.apk | grep -F 'assets/index.android.bundle'
          unzip -p openmatch-android-0.1.0-build-12.apk assets/app.config > app.config.json
          jq -e --arg source "$SOURCE_REVISION" '.android.versionCode == 12 and .extra.sourceRevision == $source' app.config.json
          sha256sum openmatch-android-0.1.0-build-12.apk | tee openmatch-android-0.1.0-build-12.sha256

      - name: Publish immutable owner-testing release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          printf '%s' "$SOURCE_REVISION" | grep -Eq '^[0-9a-f]{40}$'
          gh release create android-baseline-build-12 \
            openmatch-android-0.1.0-build-12.apk \
            openmatch-android-0.1.0-build-12.sha256 \
            signing-verification.txt \
            --target "$SOURCE_REVISION" \
            --title "WhyMatch Android owner build 12" \
            --notes "Standalone Expo SDK 57 owner-testing APK built from $SOURCE_REVISION. It uses the stable EAS Android signing identity and connects only to the documented private tailnet service. This is not a Google Play release."
